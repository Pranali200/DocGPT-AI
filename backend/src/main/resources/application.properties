spring.application.name=AiChatbotApp
server.port=${PORT:8080}

# ===============================
# PostgreSQL (Neon.tech in production, local for dev)
# ===============================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_chatbot}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Postgres}

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.7

# ==============================
# JWT
# ==============================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ==============================
# Embedding service (Cloud Run)
# ==============================

embedding.service.url=${EMBEDDING_SERVICE_URL:http://localhost:8001}